---
- name: Variable Precedence Demonstration
  hosts: all
  vars:
    my_var: "Defined at Play Level"
  
  vars_files:
    - external_vars.yml

  vars_prompt:
    - name: "prompt_var"
      prompt: "Enter a value"

  tasks:
    - name: Load extra variables
      include_vars:
        file: extra_settings.yml

    - name: Execute Role with Parameters
      include_role:
        name: my_minimal_role
      vars:
        role_param: "This overrides role defaults/vars"

    - name: Demonstrate Block and Task levels
      block:
        - name: Show Task and Registered Vars
          debug:
            msg: "Value is {{ task_var }}"
          vars:
            task_var: "I am the most specific"
          
          register: task_result

      vars:
        block_var: "I apply to all tasks in this block"

    - name: Set facts at runtime
      set_fact:
        runtime_fact: "I override almost everything"